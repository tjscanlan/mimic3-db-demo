name: Eval regression gate

on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: eval-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1-${{ runner.os }}
          restore-keys: hf-models-v1-

      - name: Install dependencies
        run: uv sync --locked

      # NOTEEVENTS.csv must stay in this list even though nothing reads its
      # content downstream -- download_mimic_demo.py's validate_downloads()
      # unconditionally requires it to exist (REQUIRED_FILES). It's ~0 rows
      # in the demo release, so including it costs no real time.
      - name: Download MIMIC-III demo data (restricted table set)
        run: >
          uv run python data/download_mimic_demo.py
          --files ADMISSIONS.csv PATIENTS.csv DIAGNOSES_ICD.csv LABEVENTS.csv
                  NOTEEVENTS.csv ICUSTAYS.csv D_ICD_DIAGNOSES.csv

      - name: Generate synthetic discharge notes
        run: uv run python data/generate_mock_noteevents.py --seed 42

      # Fastest/cheapest model first -- fail fast before the slower steps.
      - name: Train structured XGBoost baseline
        run: uv run python -m src.models.train_baseline --seed 42

      - name: Build RAG note-embedding index
        run: uv run python -m src.rag.build_index

      - name: Evaluate RAG k-NN path
        run: uv run python -m src.models.train_rag --seed 42

      # Slowest step -- DistilBERT+LoRA fine-tune, 25 fold-fits on CPU.
      - name: Fine-tune DistilBERT+LoRA (text path)
        run: uv run python -m src.models.train_slm --seed 42

      - name: Check for metric regressions
        run: uv run python -m src.eval.check_regression
