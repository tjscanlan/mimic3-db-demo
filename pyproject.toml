[project]
name = "mimic3-db-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "gradio>=6.26.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "peft>=0.20.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "sentence-transformers>=6.0.1",
    "tabulate>=0.9.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]

# CI (GitHub Actions, ubuntu-latest) has no GPU -- without this override,
# torch's default Linux wheel resolution pulls the full CUDA toolkit stack
# (cuda-toolkit, nvidia-cudnn-cu13, nvidia-nccl-cu13, etc.), multiple GB of
# useless downloads. macOS wheels have no CUDA variant, so this is a no-op
# for local dev.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
